<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperX Studio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <header class="bar">
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span class="mono devtext" id="devtext">&mdash;</span>
    <span class="grow"></span>
    <span class="mono dim" id="fps-real"></span>
    <button class="btn" id="pause" aria-pressed="false" data-i18n="pause">Pause</button>
    <button class="btn danger" id="blackout" data-i18n="blackout">Turn off</button>
  </header>

  <main id="board">
    <div class="stage" id="stage">
      <canvas id="glow" aria-hidden="true"></canvas>
      <canvas id="kb" role="img" data-i18n-aria="keyboardAria" aria-label="Keyboard layout"></canvas>
    </div>
  </main>

  <footer class="dock">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-pane="fx" data-i18n="tabEffect">Effect</button>
      <button class="tab" role="tab" data-pane="sound" data-i18n="sound">Sound</button>
      <button class="tab" role="tab" data-pane="react" data-i18n="reaction">Keypress</button>
      <button class="tab" role="tab" data-pane="keys" data-i18n="tabKeys">Keys</button>
      <button class="tab" role="tab" data-pane="presets" data-i18n="presets">Presets</button>
      <button class="tab" role="tab" data-pane="setup" data-i18n="tabSetup">Setup</button>
    </div>

    <p class="warn" id="warn" hidden></p>

    <div class="panes">

      <section class="pane" id="pane-fx" role="tabpanel">
        <div class="grid" id="params">
          <div class="ctl wide">
            <div class="lbl"><label for="effect" data-i18n="effect">Effect</label></div>
            <select id="effect"></select>
          </div>
          <div class="ctl wide">
            <div class="lbl"><label for="overlay" data-i18n="overlay">Overlay</label></div>
            <select id="overlay"></select>
          </div>
          <div class="ctl" data-p="brightness">
            <div class="lbl"><label for="brightness" data-i18n="brightness">Brightness</label><output id="brightness-v"></output></div>
            <input type="range" id="brightness" min="0" max="100">
          </div>
          <div class="ctl" data-p="speed">
            <div class="lbl"><label for="speed" data-i18n="speed">Speed</label><output id="speed-v"></output></div>
            <input type="range" id="speed" min="5" max="500">
          </div>
          <div class="ctl" data-p="angle">
            <div class="lbl"><label for="angle" data-i18n="angle">Angle</label><output id="angle-v"></output></div>
            <input type="range" id="angle" min="0" max="360">
          </div>
          <div class="ctl" data-p="scale">
            <div class="lbl"><label for="scale" data-i18n="scale">Scale</label><output id="scale-v"></output></div>
            <input type="range" id="scale" min="10" max="500">
          </div>
          <div class="ctl" data-p="density">
            <div class="lbl"><label for="density" data-i18n="density">Density</label><output id="density-v"></output></div>
            <input type="range" id="density" min="1" max="100">
          </div>
          <div class="ctl" data-p="length">
            <div class="lbl"><label for="length" data-i18n="length">Length</label><output id="length-v"></output></div>
            <input type="range" id="length" min="1" max="40">
          </div>
          <div class="ctl" data-p="saturation">
            <div class="lbl"><label for="saturation" data-i18n="saturation">Saturation</label><output id="saturation-v"></output></div>
            <input type="range" id="saturation" min="0" max="100">
          </div>
          <div class="ctl" data-p="sensitivity">
            <div class="lbl"><label for="sensitivity" data-i18n="sensitivity">Sensitivity</label><output id="sensitivity-v"></output></div>
            <input type="range" id="sensitivity" min="20" max="300">
          </div>
          <div class="ctl" data-p="color1">
            <div class="lbl"><label for="color1" data-i18n="color">Colour</label></div>
            <input type="color" id="color1">
          </div>
          <div class="ctl" data-p="color2">
            <div class="lbl"><label for="color2" data-i18n="color2">Second</label></div>
            <input type="color" id="color2">
          </div>
          <div class="ctl" data-p="background">
            <div class="lbl"><label for="background" data-i18n="background">Background</label></div>
            <input type="color" id="background">
          </div>
          <div class="ctl" data-p="reverse">
            <div class="lbl"><span data-i18n="reverse">Reverse</span></div>
            <label class="check" for="reverse">
              <input type="checkbox" id="reverse">
              <span data-i18n="reverseHint">The other way round</span>
            </label>
          </div>
        </div>
      </section>

      <section class="pane" id="pane-sound" role="tabpanel">
        <div class="grid">
          <div class="ctl wide">
            <div class="lbl"><label for="audio-src" data-i18n="soundSource">Source</label></div>
            <select id="audio-src"></select>
          </div>
          <div class="ctl wide">
            <div class="lbl"><span data-i18n="levelAria">Sound level</span></div>
            <div class="level"><div class="level-bar" id="level-bar"></div></div>
          </div>
        </div>
        <p class="warn" id="audio-warn" hidden></p>
      </section>

      <section class="pane" id="pane-react" role="tabpanel">
        <div class="grid">
          <div class="ctl">
            <div class="lbl"><label for="reactSpeed" data-i18n="speed">Speed</label><output id="reactSpeed-v"></output></div>
            <input type="range" id="reactSpeed" min="10" max="400">
          </div>
          <div class="ctl">
            <div class="lbl"><label for="reactFade" data-i18n="fade">Fade</label><output id="reactFade-v"></output></div>
            <input type="range" id="reactFade" min="15" max="400">
          </div>
          <div class="ctl">
            <div class="lbl"><label for="reactColor" data-i18n="color">Colour</label></div>
            <input type="color" id="reactColor">
          </div>
          <div class="ctl">
            <div class="lbl"><span data-i18n="rainbow">Rainbow</span></div>
            <label class="check" for="rainbow">
              <input type="checkbox" id="rainbow">
              <span data-i18n="rainbowHint">A colour per key</span>
            </label>
          </div>
        </div>
        <p class="hint" id="react-hint" data-i18n="reactHint">Pick a reactive overlay to see this.</p>
      </section>

      <section class="pane" id="pane-keys" role="tabpanel">
        <div class="grid">
          <div class="ctl">
            <div class="lbl"><span data-i18n="selection">Selection</span><output id="selcount">0</output></div>
            <div class="seg">
              <button class="btn" id="sel-all" data-i18n="selAll">All</button>
              <button class="btn" id="sel-none" data-i18n="selNone">Clear</button>
              <button class="btn" id="sel-inv" data-i18n="selInvert">Invert</button>
            </div>
          </div>
          <div class="ctl">
            <div class="lbl"><span data-i18n="selectedOnly">Selected only</span></div>
            <label class="check" for="mask">
              <input type="checkbox" id="mask">
              <span data-i18n="maskHint">Darken the rest</span>
            </label>
          </div>
          <div class="ctl full" id="paint">
            <div class="lbl"><span data-i18n="fill">Fill</span></div>
            <div class="paintrow">
              <div class="swatches" id="swatches"></div>
              <label class="btn" for="paintpick">
                <span data-i18n="customColour">Custom</span>
                <input type="color" id="paintpick" data-i18n-aria="customColourAria" aria-label="Fill with a custom colour">
              </label>
              <button class="btn" id="clearpaint" data-i18n="resetPaint">Reset</button>
            </div>
          </div>
        </div>
        <p class="hint" data-i18n="keysHint">Drag across the keyboard to select. Ctrl adds to the selection.</p>
      </section>

      <section class="pane" id="pane-presets" role="tabpanel">
        <div class="grid">
          <div class="ctl wide">
            <div class="lbl"><label for="preset" data-i18n="presets">Presets</label></div>
            <select id="preset"></select>
          </div>
          <div class="ctl wide">
            <div class="lbl"><span data-i18n="presetName">Name for this scheme</span></div>
            <div class="seg">
              <input type="text" id="preset-name" maxlength="40"
                     data-i18n-ph="presetName" placeholder="Name">
              <button class="btn" id="preset-save" data-i18n="save">Save</button>
              <button class="btn" id="preset-del" data-i18n-aria="deletePreset"
                      aria-label="Delete" hidden>&times;</button>
            </div>
          </div>
        </div>
      </section>

      <section class="pane" id="pane-setup" role="tabpanel">
        <div class="grid">
          <div class="ctl wide">
            <div class="lbl"><label for="device" data-i18n="device">Device</label></div>
            <select id="device"></select>
          </div>
          <div class="ctl">
            <div class="lbl"><label for="variant" data-i18n="layout">Layout</label></div>
            <select id="variant">
              <option value="ansi">ANSI</option>
              <option value="iso">ISO</option>
            </select>
          </div>
          <div class="ctl">
            <div class="lbl"><label for="fps" data-i18n="fps">Frames/s</label><output id="fps-v"></output></div>
            <input type="range" id="fps" min="5" max="60">
          </div>
          <div class="ctl">
            <div class="lbl"><label for="lang" data-i18n="language">Language</label></div>
            <select id="lang">
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </div>
          <div class="ctl">
            <div class="lbl"><span data-i18n="autostart">Start on login</span></div>
            <label class="check" for="autostart">
              <input type="checkbox" id="autostart">
              <span data-i18n="autostartHint">Restore lighting at login</span>
            </label>
          </div>
          <div class="ctl">
            <div class="lbl"><span data-i18n="quit">Quit</span></div>
            <button class="btn danger" id="quit" data-i18n="quitBtn">Quit the program</button>
          </div>
        </div>
        <p class="hint" id="about"></p>
      </section>

    </div>
  </footer>

</div>
<script src="/app.js"></script>
</body>
</html>
