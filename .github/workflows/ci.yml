name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Проверяем именно статическую сборку: пакет обещает отсутствие
      # зависимостей, и это должно ломать сборку, а не выясняться у пользователя.
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o hyperx-studio ./cmd/hyperx-studio

      - name: Assert no dynamic dependencies
        run: |
          if ldd hyperx-studio 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "бинарник получился динамическим:"; ldd hyperx-studio; exit 1
          fi

      - name: Shell scripts parse
        run: bash -n build-deb.sh
