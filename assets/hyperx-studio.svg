<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff2d55"/>
      <stop offset="0.33" stop-color="#ffcc00"/>
      <stop offset="0.66" stop-color="#22c55e"/>
      <stop offset="1"    stop-color="#2d7dff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#1b1b1f"/>
    </linearGradient>
  </defs>

  <!-- корпус -->
  <rect x="4" y="16" width="56" height="34" rx="6" fill="url(#body)"/>
  <rect x="4.75" y="16.75" width="54.5" height="32.5" rx="5.25"
        fill="none" stroke="#55555c" stroke-width="1.5"/>

  <!-- три ряда клавиш и пробел -->
  <g fill="#0e0e11">
    <rect x="10" y="22" width="6" height="6" rx="1.6"/>
    <rect x="18" y="22" width="6" height="6" rx="1.6"/>
    <rect x="26" y="22" width="6" height="6" rx="1.6"/>
    <rect x="34" y="22" width="6" height="6" rx="1.6"/>
    <rect x="42" y="22" width="6" height="6" rx="1.6"/>
    <rect x="50" y="22" width="4" height="6" rx="1.6"/>

    <rect x="10" y="30" width="6" height="6" rx="1.6"/>
    <rect x="18" y="30" width="6" height="6" rx="1.6"/>
    <rect x="26" y="30" width="6" height="6" rx="1.6"/>
    <rect x="34" y="30" width="6" height="6" rx="1.6"/>
    <rect x="42" y="30" width="6" height="6" rx="1.6"/>
    <rect x="50" y="30" width="4" height="6" rx="1.6"/>

    <rect x="10" y="38" width="10" height="6" rx="1.6"/>
    <rect x="22" y="38" width="20" height="6" rx="1.6"/>
    <rect x="44" y="38" width="10" height="6" rx="1.6"/>
  </g>

  <!-- свечение из-под корпуса: то, ради чего программа и существует -->
  <rect x="8" y="50" width="48" height="5" rx="2.5" fill="url(#rgb)" opacity="0.95"/>
  <rect x="12" y="55" width="40" height="3" rx="1.5" fill="url(#rgb)" opacity="0.4"/>
</svg>
